name: Build getgua client APK

# Build hanya bila kode aplikasi berubah (bukan saat phone_server.py berubah).
on:
  push:
    branches: [main]
    paths:
      - 'android-client/**'
      - '.github/workflows/android-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: getgua-client-apk
          path: android-client/app/build/outputs/apk/debug/*.apk
